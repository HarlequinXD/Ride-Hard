name: Build Windows

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build the desktop game
        run: |
          set -o pipefail
          gradle -p desktop installDist --console=plain --stacktrace 2>&1 | tee build.log

      - name: Package Eryndor.exe with its own Java runtime
        run: |
          set -o pipefail
          LIB=desktop/build/install/eryndor-desktop/lib
          ls "$LIB"
          jpackage --type app-image --name Eryndor \
            --app-version 1.0 --vendor HarlequinXD \
            --input "$LIB" --main-jar eryndor.jar \
            --main-class com.harlequinxd.eryndor.DesktopMain \
            --java-options "-Xmx2g" \
            --dest dist 2>&1 | tee -a build.log
          cp README.md dist/Eryndor/README.md
          cd dist && 7z a -tzip ../Eryndor-Windows.zip Eryndor > /dev/null
          ls -la ..

      - name: Report build errors
        if: failure()
        run: |
          grep -E "error:|warning: \[|What went wrong|Could not|Exception|FAILED|e: " -A2 build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done

      - uses: actions/upload-artifact@v4
        with:
          name: Eryndor-Windows
          path: Eryndor-Windows.zip

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (${{ github.ref_name }})
          prerelease: true
          files: Eryndor-Windows.zip
